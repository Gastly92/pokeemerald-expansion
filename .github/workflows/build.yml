name: CI

on:
  push:
    branches:
      - master
      - upcoming
  pull_request:

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  COMPARE: 0
  UNUSED_ERROR: 1
  DEPRECATED_ERROR: 1

jobs:
  # Detect whether this push/PR touches anything other than Markdown docs.
  # Outputs code=true when any non-*.md file changed (the safe default — see
  # below), code=false for docs-only changes so the heavy build/test jobs skip.
  # We DON'T use the workflow-level `paths-ignore`: the `build` gate job is a
  # required status check, and skipping the whole workflow would leave that
  # check "waiting" forever and block the PR. Conditionally skipping the heavy
  # jobs instead keeps the gate running and reporting.
  changes:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A filter of only negation patterns matches any changed file that is
      # NOT markdown. If dorny can't determine the diff it returns true, so an
      # unknown state runs full CI rather than skipping it.
      - name: Detect non-docs changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!**/*.md'

  build-emerald:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FORK: upstream owns this CI workflow and ships its own inline "Install
      # binutils" apt-get step. We replaced that inline step with a hardened,
      # de-duplicated composite action (.github/actions/install-binutils) to
      # stop intermittent CI hangs, plus a timeout-minutes backstop. On a merge
      # conflict here, KEEP our `uses:` + timeout-minutes; if upstream changed
      # which apt packages get installed, port that into the action's package
      # list rather than re-inlining their apt-get step.
      - name: Install binutils
        uses: ./.github/actions/install-binutils
        timeout-minutes: 5

      - name: Cache build tools
        uses: actions/cache@v5
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Emerald)
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) -O all

  build-firered:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FORK: upstream owns this CI workflow and ships its own inline "Install
      # binutils" apt-get step. We replaced that inline step with a hardened,
      # de-duplicated composite action (.github/actions/install-binutils) to
      # stop intermittent CI hangs, plus a timeout-minutes backstop. On a merge
      # conflict here, KEEP our `uses:` + timeout-minutes; if upstream changed
      # which apt packages get installed, port that into the action's package
      # list rather than re-inlining their apt-get step.
      - name: Install binutils
        uses: ./.github/actions/install-binutils
        timeout-minutes: 5

      - name: Cache build tools
        uses: actions/cache@v5
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Firered)
        run: make firered -j$(nproc) -O

  build-leafgreen:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FORK: upstream owns this CI workflow and ships its own inline "Install
      # binutils" apt-get step. We replaced that inline step with a hardened,
      # de-duplicated composite action (.github/actions/install-binutils) to
      # stop intermittent CI hangs, plus a timeout-minutes backstop. On a merge
      # conflict here, KEEP our `uses:` + timeout-minutes; if upstream changed
      # which apt packages get installed, port that into the action's package
      # list rather than re-inlining their apt-get step.
      - name: Install binutils
        uses: ./.github/actions/install-binutils
        timeout-minutes: 5

      - name: Cache build tools
        uses: actions/cache@v5
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: ROM (Leafgreen)
        run: make leafgreen -j$(nproc) -O

  release:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FORK: upstream owns this CI workflow and ships its own inline "Install
      # binutils" apt-get step. We replaced that inline step with a hardened,
      # de-duplicated composite action (.github/actions/install-binutils) to
      # stop intermittent CI hangs, plus a timeout-minutes backstop. On a merge
      # conflict here, KEEP our `uses:` + timeout-minutes; if upstream changed
      # which apt packages get installed, port that into the action's package
      # list rather than re-inlining their apt-get step.
      - name: Install binutils
        uses: ./.github/actions/install-binutils
        timeout-minutes: 5

      - name: Cache build tools
        uses: actions/cache@v5
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
          key: tools-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Release
        env:
          GAME_VERSION: EMERALD
        run: make -j$(nproc) release

      # Make the built Emerald ROM downloadable from the Actions run page,
      # but only for commits that land on master (not pull requests).
      - name: Upload Emerald ROM
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: pokeemerald-release
          path: pokeemerald-release.gba
          if-no-files-found: error

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # FORK: upstream owns this CI workflow and ships its own inline "Install
      # binutils" apt-get step. We replaced that inline step with a hardened,
      # de-duplicated composite action (.github/actions/install-binutils) to
      # stop intermittent CI hangs, plus a timeout-minutes backstop. On a merge
      # conflict here, KEEP our `uses:` + timeout-minutes; if upstream changed
      # which apt packages get installed, port that into the action's package
      # list rather than re-inlining their apt-get step.
      - name: Install binutils
        uses: ./.github/actions/install-binutils
        timeout-minutes: 5

      - name: Cache build tools
        uses: actions/cache@v5
        with:
          path: |
            tools/bin2c/bin2c
            tools/gbafix/gbafix
            tools/gbagfx/gbagfx
            tools/jsonproc/jsonproc
            tools/mapjson/mapjson
            tools/mid2agb/mid2agb
            tools/preproc/preproc
            tools/ramscrgen/ramscrgen
            tools/rsfont/rsfont
            tools/scaninc/scaninc
            tools/trainerproc/trainerproc
            tools/compresSmol/compresSmol
            tools/compresSmol/compresSmolTilemap
            tools/wav2agb/wav2agb
            tools/patchelf/patchelf
            tools/mgba-rom-test-hydra/mgba-rom-test-hydra
          key: tools-check-${{ runner.os }}-${{ hashFiles('tools/*/Makefile', 'tools/**/*.c', 'tools/**/*.cpp', 'tools/**/*.h') }}

      - name: Test
        env:
          GAME_VERSION: EMERALD
          TEST: 1
        run: make -j$(nproc) check

  # Gate job: satisfies the "build" branch protection rule.
  # Passes only when all parallel build/test jobs succeed.
  #
  # Must use always() so this job still RUNS when a dependency fails.
  # Without it, a failed dependency causes this job to be *skipped*, and
  # branch protection treats a skipped required check as non-blocking —
  # letting a PR auto-merge despite a broken build. With always() we run
  # regardless and explicitly fail unless every dependency succeeded.
  build:
    if: always() && github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: [changes, build-emerald, build-firered, build-leafgreen, release, test]
    steps:
      # 'skipped' is an accepted result: the heavy jobs are intentionally
      # skipped on docs-only (*.md) changes, and the gate must still pass so the
      # required check reports green. Any other non-success (failure/cancelled)
      # still fails the gate.
      - name: Verify all build/test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Dependency results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required build/test job did not succeed (got '$result')."
              exit 1
            fi
          done
          echo "All builds and tests passed."

  docs_validate:
    if: github.actor != 'allcontributors[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check that SUMMARY.md includes markdown doc files
        run: .github/docs_validate/inclusive_summary.py

  allcontributors:
    if: github.actor == 'allcontributors[bot]'
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Automatically pass for allcontributors
        run: echo "CI automatically passes for allcontributors" && exit 0
