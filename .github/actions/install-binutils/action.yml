name: Install binutils
description: >-
  Install the GBA cross-toolchain (binutils/gcc/newlib) and build deps used by
  every CI job. Each install attempt is hard-bounded by a per-attempt timeout
  and retried with backoff, so a transient dpkg-lock or mirror stall is killed
  and retried automatically — the step only fails after all attempts exhaust,
  and it never hangs or needs a manual workflow restart.

# FORK: this composite action is fork-owned (it has no upstream counterpart, so
# it never conflicts on sync). It exists to de-duplicate and harden what was an
# inline "Install binutils" apt-get step copy-pasted into every CI job. The
# workflow steps that call it (`uses: ./.github/actions/install-binutils`) DO
# diverge from upstream's inline step — see the FORK notes at those call sites.

runs:
  using: composite
  steps:
    - name: Install binutils
      shell: bash
      # Self-healing install: each attempt is wrapped in `timeout` so a hang
      # (stalled mirror connection, or the dpkg lock held by the runner's
      # background apt-daily/unattended-upgrades jobs) is KILLED and the loop
      # retries — instead of running until the step's outer timeout-minutes cap
      # fails the whole job. Layered bounds, innermost to outermost:
      #   - Acquire::*::Timeout=30  : abort a stalled mirror connection (30s).
      #   - Acquire::Retries=3      : apt retries individual failed fetches.
      #   - DPkg::Lock::Timeout=120 : fail (not hang) if the dpkg lock is held;
      #                               kept BELOW the per-attempt `timeout` so a
      #                               lock wait ends the attempt, not the step.
      #   - timeout -k 10 N         : hard wall-clock cap per apt invocation.
      #   - for-loop + backoff      : retry the whole update+install 3x; by the
      #                               next attempt the lock/mirror has cleared.
      #   - dpkg --configure -a     : heal dpkg if a `timeout` kill interrupted it.
      # DEBIAN_FRONTEND=noninteractive keeps any debconf prompt from blocking.
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        set -u
        packages=(binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3)
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=120
        )
        for attempt in 1 2 3; do
          if sudo timeout -k 10 120 apt-get update "${apt_opts[@]}" && \
             sudo timeout -k 10 240 apt-get install -y --no-install-recommends \
               "${apt_opts[@]}" "${packages[@]}"; then
            echo "binutils toolchain installed (attempt ${attempt}/3)"
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            backoff=$((attempt * 15))
            echo "::warning::apt-get attempt ${attempt}/3 failed or timed out; healing dpkg and retrying in ${backoff}s"
            sudo dpkg --configure -a || true
            sleep "${backoff}"
          fi
        done
        echo "::error::apt-get failed after 3 attempts"
        exit 1
