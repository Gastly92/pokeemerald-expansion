name: Install binutils
description: >-
  Install the GBA cross-toolchain (binutils/gcc/newlib) and build deps used by
  every CI job. Caches the downloaded .deb packages so jobs install from GitHub's
  cache instead of the (intermittently slow) Ubuntu mirror, and wraps each apt
  invocation in a per-attempt timeout + retry so a transient stall is killed and
  retried automatically rather than hanging or failing the job.

# FORK: this composite action is fork-owned (no upstream counterpart, so it never
# conflicts on sync). It de-duplicates and hardens what was an inline "Install
# binutils" apt-get step copy-pasted into every CI job. The workflow steps that
# call it (`uses: ./.github/actions/install-binutils`) DO diverge from upstream's
# inline step — see the FORK notes at those call sites.

runs:
  using: composite
  steps:
    # Cache the downloaded .deb archives (~107 MB of toolchain). On a hit the
    # install below resolves entirely from these local files and never touches
    # the Ubuntu mirror — which is the actual source of the intermittent CI
    # failures (it periodically trickles the packages too slowly to finish
    # inside any sane timeout). Keyed on this action file, so editing the
    # package list automatically busts the cache.
    - name: Cache apt toolchain packages
      id: apt-cache
      uses: actions/cache@v5
      with:
        path: /tmp/apt-debs
        key: apt-binutils-${{ runner.os }}-${{ hashFiles('.github/actions/install-binutils/action.yml') }}

    - name: Install binutils
      shell: bash
      # Self-healing install. Layered bounds, innermost to outermost:
      #   - Dir::Cache::archives=/tmp/apt-debs + Keep-Downloaded-Packages: install
      #     from cached .debs and keep them for the cache to save; on a cache hit
      #     the ~107 MB download is skipped entirely (the main reliability win).
      #   - Acquire::*::Timeout=30  : abort a stalled mirror connection (30s).
      #   - Acquire::Retries=3      : apt retries individual failed fetches.
      #   - DPkg::Lock::Timeout=120 : fail (not hang) if the dpkg lock is held;
      #                               kept BELOW the per-attempt `timeout`.
      #   - timeout -k 10 N         : hard wall-clock cap per apt invocation, so a
      #                               slow/stalled download is killed, not waited
      #                               on. 360s for install covers a full
      #                               cache-miss download even on a slow mirror.
      #   - for-loop + backoff      : retry update+install 3x; a fresh attempt
      #                               resumes partial downloads and by then the
      #                               lock/mirror has usually cleared.
      #   - dpkg --configure -a     : heal dpkg if a `timeout` kill interrupted it.
      # The outer step `timeout-minutes` (set at each call site) is the final
      # backstop above this loop's worst case: 3*(120+360) + 15 + 30 backoff =
      # 1485s, plus the 120s fast path below = ~27min, so call sites set 30.
      # DEBIAN_FRONTEND keeps debconf from blocking on stdin.
      #
      # FAST PATH (see below): `apt-get update` is the step that actually fails.
      # It fetches repository INDEXES from the Ubuntu mirror, which the .deb cache
      # does not cover, so on a cache hit we were still gated on the mirror for no
      # benefit -- and because update is `&&`-chained ahead of install, a stalled
      # mirror killed the attempt before the cached .debs were ever used. The
      # runner image ships a populated /var/lib/apt/lists (visible as `Hit:` lines
      # for noble in any run's log), so `apt-get install` resolves these five
      # packages from the on-disk index alone; combined with the cached .debs it
      # completes without contacting the mirror at all. Try that first on a cache
      # hit, and fall back to the update+install loop if anything is missing.
      env:
        DEBIAN_FRONTEND: noninteractive
        CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
      run: |
        set -u
        packages=(binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3)
        # apt (run as root via sudo) and actions/cache (run as the runner user)
        # share /tmp/apt-debs, so make it world-accessible and pre-create the
        # `partial` subdir apt expects. Use an absolute path, not ~, because
        # under sudo ~ would resolve to root's home, not the runner's.
        sudo mkdir -p /tmp/apt-debs/partial
        sudo chmod -R 0777 /tmp/apt-debs
        apt_opts=(
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
          -o DPkg::Lock::Timeout=120
          -o Dir::Cache::archives=/tmp/apt-debs
          -o APT::Keep-Downloaded-Packages=true
        )
        # Fast path: cached .debs + the image's existing indexes, no mirror.
        if [ "${CACHE_HIT:-}" = "true" ] && \
           sudo timeout -k 10 120 apt-get install -y --no-install-recommends \
             "${apt_opts[@]}" "${packages[@]}"; then
          echo "binutils toolchain installed from cached .debs (no apt-get update)"
          exit 0
        fi
        # A `timeout` kill above can leave dpkg mid-transaction; heal before falling back
        # so the loop's first attempt starts clean rather than burning one on the wreckage.
        sudo dpkg --configure -a || true
        echo "::notice::cached-install fast path unavailable or failed; falling back to apt-get update"
        for attempt in 1 2 3; do
          if sudo timeout -k 10 120 apt-get update "${apt_opts[@]}" && \
             sudo timeout -k 10 360 apt-get install -y --no-install-recommends \
               "${apt_opts[@]}" "${packages[@]}"; then
            # Let the runner user read the root-owned .debs so the cache can save them.
            sudo chmod -R a+rX /tmp/apt-debs || true
            echo "binutils toolchain installed (attempt ${attempt}/3)"
            exit 0
          fi
          if [ "${attempt}" -lt 3 ]; then
            backoff=$((attempt * 15))
            echo "::warning::apt-get attempt ${attempt}/3 failed or timed out; healing dpkg and retrying in ${backoff}s"
            sudo dpkg --configure -a || true
            sleep "${backoff}"
          fi
        done
        echo "::error::apt-get failed after 3 attempts"
        exit 1
